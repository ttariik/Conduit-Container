name: Deploy Conduit to Cloud VM

on:
  push:
    branches:
      - main
      - conduit
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: true
          build-args: |
            PYTHON_VERSION=3.9-slim

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_VERSION=20.12.2
            FRONTEND_BUILD_CONFIGURATION=production

  deploy:
    name: Deploy to Cloud VM
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Verify SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "echo 'SSH connection successful'" || {
            echo "ERROR: SSH connection failed"
            exit 1
          }

      - name: Create deployment directory on VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "mkdir -p ~/conduit-deployment" || {
            echo "ERROR: Failed to create deployment directory"
            exit 1
          }

      - name: Transfer files to VM
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='frontend/node_modules' \
            --exclude='frontend/dist' \
            --exclude='backend/__pycache__' \
            --exclude='*.log' \
            --exclude='.env' \
            ./ ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/conduit-deployment/ || {
            echo "ERROR: File transfer failed"
            exit 1
          }

      - name: Transfer environment configuration
        run: |
          echo "${{ secrets.ENV_FILE }}" | ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "cat > ~/conduit-deployment/.env" || {
            echo "ERROR: Failed to transfer environment configuration"
            exit 1
          }

      - name: Log in to Container Registry on VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin" || {
            echo "ERROR: Failed to log in to container registry"
            exit 1
          }

      - name: Stop running containers
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "cd ~/conduit-deployment && docker-compose down || true"

      - name: Pull latest images from registry
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "
            cd ~/conduit-deployment
            export IMAGE_TAG=\${GITHUB_REF##*/}
            docker-compose pull
          " || {
            echo "ERROR: Failed to pull images from registry"
            exit 1
          }

      - name: Start services in detached mode
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "
            cd ~/conduit-deployment
            export IMAGE_TAG=\${GITHUB_REF##*/}
            docker-compose up -d
          " || {
            echo "ERROR: Failed to start services"
            exit 1
          }

      - name: Wait for services to be healthy
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "
            cd ~/conduit-deployment
            echo 'Waiting for services to become healthy...'
            for i in {1..30}; do
              BACKEND_HEALTH=\$(docker inspect --format='{{.State.Health.Status}}' conduit-backend 2>/dev/null || echo 'not_found')
              FRONTEND_STATUS=\$(docker inspect --format='{{.State.Status}}' conduit-frontend 2>/dev/null || echo 'not_found')
              
              echo \"Attempt \$i/30: Backend health: \$BACKEND_HEALTH, Frontend status: \$FRONTEND_STATUS\"
              
              if [ \"\$BACKEND_HEALTH\" = 'healthy' ] && [ \"\$FRONTEND_STATUS\" = 'running' ]; then
                echo 'All services are ready'
                exit 0
              fi
              
              sleep 10
            done
            
            echo 'ERROR: Services did not become healthy in time'
            docker-compose ps
            docker-compose logs --tail=50
            exit 1
          " || {
            echo "ERROR: Health check failed"
            exit 1
          }

      - name: Verify deployment
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "
            echo 'Verifying deployment...'
            curl -f http://127.0.0.1:8000/api/tags/ > /dev/null || {
              echo 'ERROR: Backend health check failed'
              exit 1
            }
            curl -f http://127.0.0.1:8282/ > /dev/null || {
              echo 'ERROR: Frontend health check failed'
              exit 1
            }
            echo 'Deployment verification successful'
          " || {
            echo "ERROR: Deployment verification failed"
            exit 1
          }

      - name: Display service status
        if: success()
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "cd ~/conduit-deployment && docker-compose ps"

      - name: Cleanup on failure
        if: failure()
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "
            cd ~/conduit-deployment
            echo 'Deployment failed. Collecting logs...'
            docker-compose logs --tail=100
            echo 'Stopping failed deployment...'
            docker-compose down
          " || true

